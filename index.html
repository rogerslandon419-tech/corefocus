function readPfp(file){

}

/* screen share queue: each person's request lives in their own LiveKit participant metadata {q:requestedAt,live:startedAt}.
   Everyone sorts the same list, so every client agrees on who is live and who is next. */
function setMeta(o){if(lk)lk.localParticipant.setMetadata(JSON.stringify(o)).catch(()=>toast('Could not update the share queue.'))}
function syncShare(){if(!lk){SH.cur=null;SH.queue=[];return}
  const me=lk.localParticipant,now=Date.now();
  const L=[me,...lk.remoteParticipants.values()].map(p=>{let m={};try{m=JSON.parse(p.metadata||'{}')}catch(e){}return{id:p.identity,name:p===me?'You':String(p.name||'Guest'),q:+m.q||0,live:+m.live||0}}).filter(x=>x.q).sort((a,b)=>a.q-b.q||(a.id<b.id?-1:1));
  if(!L.length){SH.cur=null;SH.queue=[];return}
  const c=L[0],rest=L.slice(1),base=c.live||(c.id===S.uid?SH.liveAt:0)||now;
  let end=base+900000;if(rest.length)end=Math.min(end,Math.max(base,rest[0].q)+120000);
  SH.cur={who:c.name,id:c.id,left:Math.max(0,(end-now)/1000)};SH.queue=rest.map(x=>x.name)}
function myTurn(){const c=SH.cur;if(!c||c.id!==S.uid)return;
  if(!SH.mine){SH.mine=true;SH.liveAt=Date.now();let m={};try{m=JSON.parse(lk.localParticipant.metadata||'{}')}catch(e){}
    setMeta({q:m.q||SH.liveAt,live:SH.liveAt});
    lk.localParticipant.setScreenShareEnabled(true).then(()=>toast('You are live. 15 minutes.')).catch(()=>{toast('Screen share was cancelled.');endShare(false)})}
  else if(c.left<=0)endShare(true)}
function endShare(auto){SH.mine=false;SH.liveAt=0;S.cool=300;if(lk){lk.localParticipant.setScreenShareEnabled(false).catch(()=>{});setMeta({})}if(auto)toast('Your 15 minutes are up.');render()}
/* video: only the people on the current page stay subscribed, so big rooms stay light */
function attachMedia(){
  if(!lk||!S.roomId)return;const Src=LK.Track.Source;markSpeaking();
  lk.remoteParticipants.forEach(p=>{const pub=p.getTrackPublication(Src.Camera),want=VIS.has(p.identity);if(pub&&pub.isSubscribed!==want)pub.setSubscribed(want)});
  const put=(key,pub,host,first)=>{let v=VID[key];const tr=pub&&pub.track;
    if(tr&&!pub.isMuted){if(!v||v.dataset.sid!==pub.trackSid){if(v)v.remove();v=tr.attach();v.dataset.sid=pub.trackSid;v.muted=true;if(key==='me')v.style.transform='scaleX(-1)';VID[key]=v}
      if(v.parentNode!==host)first?host.insertBefore(v,host.firstChild):host.appendChild(v)}
    else if(v&&v.parentNode===host)v.remove()};
  document.querySelectorAll('.tile[data-pid]').forEach(t=>{const id=t.dataset.pid,p=id==='me'?lk.localParticipant:lk.remoteParticipants.get(id);if(p)put(id,p.getTrackPublication(Src.Camera),t,1)});
  const st=document.getElementById('shareStage');
  if(st){syncShare();const c=SH.cur,p=c&&(c.id===S.uid?lk.localParticipant:lk.remoteParticipants.get(c.id));
    if(p)put('stage',p.getTrackPublication(Src.ScreenShare),st);else if(VID.stage){VID.stage.remove();delete VID.stage}}
}
async function joinLive(id){
  leaveLive();S.chat=[];S.live='connecting';
  try{
    if(!sb||!LK)throw new Error('Supabase or LiveKit library did not load');
    const {data,error}=await sb.functions.invoke('livekit-token',{body:{room:'cf-'+id}});
    if(error)throw error;
    if(!data||!data.token)throw new Error('The token function returned no token');
    if(S.roomId!==id){S.live='off';return}
    const r=new LK.Room({adaptiveStream:true,dynacast:true}),E=LK.RoomEvent;lk=r;
    [E.ParticipantConnected,E.ParticipantDisconnected,E.TrackPublished,E.TrackUnpublished,E.TrackMuted,E.TrackUnmuted,E.ParticipantNameChanged].forEach(ev=>r.on(ev,refreshPeers));
    r.on(E.TrackSubscribed,t=>{if(t.kind==='audio')$('#audioBox').appendChild(t.attach());refreshPeers()});
    r.on(E.TrackUnsubscribed,t=>{t.detach().forEach(e=>e.remove());Object.keys(VID).forEach(k=>{if(VID[k].dataset.sid===t.sid)delete VID[k]});refreshPeers()});
    r.on(E.LocalTrackPublished,()=>softRender());
    r.on(E.LocalTrackUnpublished,pub=>{if(SH.mine&&pub.source===LK.Track.Source.ScreenShare)endShare(false);else softRender()});
    r.on(E.ParticipantMetadataChanged,()=>{syncShare();rr('shareBar',shareBarHTML);attachMedia()});
    r.on(E.ActiveSpeakersChanged,sp=>{SPK=new Set(sp.map(p=>p===r.localParticipant?'me':p.identity));markSpeaking()});
    r.on(E.DataReceived,(buf,p,kind,topic)=>{let d;try{d=JSON.parse(new TextDecoder().decode(buf))}catch(e){return}
      if(topic==='dm'){incomingDM(p,d);return}if(topic!=='chat')return;
      if(!d||typeof d.t!=='string')return;S.chat.push({who:String((p&&p.name)||d.n||'Guest').slice(0,24),t:d.t.slice(0,300),rep:typeof d.r==='string'?d.r.slice(0,90):''});softRender()});
    r.on(E.Disconnected,()=>{if(lk===r){lk=null;S.live='off';PEERS=[];SPK=new Set();toast('Disconnected from the room.')}});
    await r.connect(CFG.lk,data.token);
    if(S.roomId!==id){r.disconnect();if(lk===r)lk=null;S.live='off';return}
    S.live='on';syncPresence();refreshPeers();
  }catch(e){
    try{if(lk)lk.disconnect()}catch(_){}
    lk=null;S.live='off';let m=(e&&e.message)||'unknown error';
    try{if(e&&e.context&&e.context.text)m=await e.context.text()}catch(_){}
    toast('Could not start live video: '+esc(String(m).slice(0,160)))}
}
(async function boot(){
  if(!window.supabase||CFG.url.includes('YOUR-')){toast('Add your Supabase and LiveKit keys at the top of the script.');return}
  try{if(Object.keys(localStorage).some(k=>/^sb-.*-auth-token$/.test(k)))S.screen='loading'}catch(e){}
  sb=window.supabase.createClient(CFG.url,CFG.key);
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){leaveLive();S.roomId=null;S.uid=null;S.owner=false;S.credits=0;S.user={name:'',bio:'',major:'',pfp:''};S.screen='signin';render()}});
  try{const {data}=await sb.auth.getSession();
    if(data.session)await enter(data.session.user);else if(S.screen==='loading'){S.screen='signin';render()}
  }catch(e){S.screen='signin';render();toast('Could not restore your session. Please sign in.')}
})();
render();
})();
</script>
